name: Apply PDF evidence lab

on:
  push:
    branches: [chatgpt/pdf-citation-evidence]
    paths:
      - ".github/workflows/apply-evidence-pdf-lab.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/pdf-citation-evidence
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-evidence-pdf-lab.mjs
      - run: npm install
      - run: npm run vendor:research
      - run: npm run build:evidence-pdf
      - name: Commit generated evidence lab
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js styles.css tests/handbook.spec.js AGENTS.md package.json package-lock.json scripts/vendor-research-tools.mjs scripts/generate-evidence-pdf.mjs vendor materials/evidence-library-pilot.pdf
          git commit -m "feat: add PDF source verification lab"
          git push origin HEAD:chatgpt/pdf-citation-evidence
