name: Apply Nutshell-style inline help

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-nutshell-inline.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-nutshell-inline.mjs
      - name: Commit front-end changes
        run: |
          if git diff --quiet; then
            echo "No front-end changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css tests/handbook.spec.js
          git commit -m "feat: add Nutshell-style inline explanations"
          git push origin HEAD:main
