name: Apply Plot prototype

# One-time branch builder; remove after generated files are committed.
on:
  push:
    branches: [chatgpt/plot-prose-quality]
    paths:
      - ".github/workflows/apply-plot-prose.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/plot-prose-quality
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run vendor:plot
      - run: node scripts/apply-plot-lab.mjs
      - name: Commit generated prototype
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js styles.css tests/handbook.spec.js vendor package-lock.json
          git commit -m "feat: add missing-data Observable Plot lab"
          git push origin HEAD:chatgpt/plot-prose-quality
