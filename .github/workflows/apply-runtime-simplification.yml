name: Apply runtime simplification

on:
  push:
    branches: [chatgpt/runtime-simplification]
    paths:
      - ".github/workflows/apply-runtime-simplification.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/runtime-simplification
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-runtime-simplification.mjs
      - run: npm install
      - run: npm run build:evidence-citation
      - run: npm run check:generated
      - name: Remove Citation.js runtime bundle
        run: |
          git rm -f vendor/citation.min.js vendor/citation.LICENSE.md || true
      - name: Commit simplification
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js tests/handbook.spec.js AGENTS.md package.json package-lock.json scripts/vendor-research-tools.mjs scripts/build-evidence-citation.mjs vendor
          git commit -m "perf: keep Citation.js out of the browser runtime"
          git push origin HEAD:chatgpt/runtime-simplification
