name: Apply subtractive refactor

on:
  push:
    branches: [chatgpt/subtractive-refactor]
    paths:
      - ".github/workflows/apply-subtractive-refactor.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/subtractive-refactor
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-subtractive-copy.mjs
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Commit copy fixes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "refactor: align copy with simplified lessons"
          git push origin HEAD:chatgpt/subtractive-refactor
