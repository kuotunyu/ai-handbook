<svg id="svg_quadrant" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 640px;" viewBox="0 0 640 540" role="graphics-document document" aria-roledescription="quadrantChart"><style>#svg_quadrant{font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC','Segoe UI',sans-serif;font-size:18px;fill:#1D2A30;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#svg_quadrant .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#svg_quadrant .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#svg_quadrant .error-icon{fill:#DCE4DD;}#svg_quadrant .error-text{fill:#1D2A30;stroke:#1D2A30;}#svg_quadrant .edge-thickness-normal{stroke-width:1px;}#svg_quadrant .edge-thickness-thick{stroke-width:3.5px;}#svg_quadrant .edge-pattern-solid{stroke-dasharray:0;}#svg_quadrant .edge-thickness-invisible{stroke-width:0;fill:none;}#svg_quadrant .edge-pattern-dashed{stroke-dasharray:3;}#svg_quadrant .edge-pattern-dotted{stroke-dasharray:2;}#svg_quadrant .marker{fill:#24465C;stroke:#24465C;}#svg_quadrant .marker.cross{stroke:#24465C;}#svg_quadrant svg{font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC','Segoe UI',sans-serif;font-size:18px;}#svg_quadrant p{margin:0;}#svg_quadrant .node .neo-node{stroke:#24465C;}#svg_quadrant [data-look="neo"].node rect,#svg_quadrant [data-look="neo"].cluster rect,#svg_quadrant [data-look="neo"].node polygon{stroke:url(#svg_quadrant-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#svg_quadrant [data-look="neo"].swimlane.cluster rect{filter:none;}#svg_quadrant [data-look="neo"].node path{stroke:url(#svg_quadrant-gradient);stroke-width:1px;}#svg_quadrant [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#svg_quadrant [data-look="neo"].node .neo-line path{stroke:#24465C;filter:none;