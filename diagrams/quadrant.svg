<svg id="svg_quadrant" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 760px;" viewBox="0 0 760 600" role="graphics-document document" aria-roledescription="quadrantChart"><style>#svg_quadrant{font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC','Segoe UI',sans-serif;font-size:22px;fill:#1E2B2C;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#svg_quadrant .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#svg_quadrant .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#svg_quadrant .error-icon{fill:#DDF0E7;}#svg_quadrant .error-text{fill:#1E2B2C;stroke:#1E2B2C;}#svg_quadrant .edge-thickness-normal{stroke-width:1px;}#svg_quadrant .edge-thickness-thick{stroke-width:3.5px;}#svg_quadrant .edge-pattern-solid{stroke-dasharray:0;}#svg_quadrant .edge-thickness-invisible{stroke-width:0;fill:none;}#svg_quadrant .edge-pattern-dashed{stroke-dasharray:3;}#svg_quadrant .edge-pattern-dotted{stroke-dasharray:2;}#svg_quadrant .marker{fill:#164D5B;stroke:#164D5B;}#svg_quadrant .marker.cross{stroke:#164D5B;}#svg_quadrant svg{font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC','Segoe UI',sans-serif;font-size:22px;}#svg_quadrant p{margin:0;}#svg_quadrant .node .neo-node{stroke:#164D5B;}#svg_quadrant [data-look="neo"].node rect,#svg_quadrant [data-look="neo"].cluster rect,#svg_quadrant [data-look="neo"].node polygon{stroke:url(#svg_quadrant-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#svg_quadrant [data-look="neo"].swimlane.cluster rect{filter:none;}#svg_quadrant [data-look="neo"].node path{stroke:url(#svg_quadrant-gradient);stroke-width:1px;}#svg_quadrant [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#svg_quadrant [data-look="neo"].node .neo-line path{stroke:#164D5B;filter:none;}#svg_quadrant [data-look="neo"].node circle{stroke:url(#svg_quadrant-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#svg_quadrant [data-look="neo"].node circle .state-start{fill:#000000;}#svg_quadrant [data-look="neo"].icon-shape .icon{fill:url(#svg_quadrant-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#svg_quadrant [data-look="neo"].icon-shape .icon-neo path{stroke:url(#svg_quadrant-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#svg_quadrant :root{--mermaid-font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC','Segoe UI',sans-serif;}</style><g></g><g class="main"><g class="quadrants"><g class="quadrant"><rect x="395" y="54" width="359" height="255" fill="#DDEEF1"></rect><text x="0" y="0" fill="#1E2B2C" font-size="21" dominant-baseline="hanging" text-anchor="middle" transform="translate(574.5, 59) rotate(0)">密切合作</text></g><g class="quadrant"><rect x="36" y="54" width="359" height="255" fill="#FBE2E5"></rect><text x="0" y="0" fill="#1E2B2C" font-size="21" dominant-baseline="hanging" text-anchor="middle" transform="translate(215.5, 59) rotate(0)">維持滿意</text></g><g class="quadrant"><rect x="36" y="309" width="359" height="255" fill="#DDF0E7"></rect><text x="0" y="0" fill="#1E2B2C" font-size="21" dominant-baseline="hanging" text-anchor="middle" transform="translate(215.5, 314) rotate(0)">觀察即可</text></g><g class="quadrant"><rect x="395" y="309" width="359" height="255" fill="#FFFFFF"></rect><text x="0" y="0" fill="#1E2B2C" font-size="21" dominant-baseline="hanging" text-anchor="middle" transform="translate(574.5, 314) rotate(0)">持續告知</text></g></g><g class="border"><line x1="35" y1="54" x2="755" y2="54" style="stroke: rgb(22, 77, 91); stroke-width: 2;"></line><line x1="754" y1="55" x2="754" y2="563" style="stroke: rgb(22, 77, 91); stroke-width: 2;"></line><line x1="35" y1="564" x2="755" y2="564" style="stroke: rgb(22, 77, 91); stroke-width: 2;"></line><line x1="36" y1="55" x2="36" y2="563" style="stroke: rgb